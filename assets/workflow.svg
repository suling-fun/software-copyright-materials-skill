  <text class="cap" x="12" y="924">每一处确认均须停止执行并等待用户输入，不得以「用户未选择则默认继续」的方式放行；用户回复后先记录该次确认，再进入下一阶段。</text>
  <text class="cap" x="12" y="942">第 12 步手册转 PDF 前须更新 Word 域，否则目录页码会全部印成 1；第 13 步的独立核实须以原始问题委派，不由生成材料的一方代劳。</text>
