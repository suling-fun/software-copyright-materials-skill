<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 808 956" width="808" height="956" role="img" aria-label="工作流泳道图：脚本执行、模型研判与撰写、用户确认、中国版权保护中心四条泳道，二十一个步骤自上而下推进">
  <style>
