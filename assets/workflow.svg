    .gate-text { fill: #4d2d00; font: 500 10px ui-sans-serif, system-ui, "PingFang SC", sans-serif; }
    .edge { stroke: #8c959f; stroke-width: 1.1; fill: none; }
    .cap { fill: #6e7781; font: 400 10.5px ui-sans-serif, system-ui, "PingFang SC", sans-serif; }
    .title { fill: #1f2328; font: 600 13px ui-sans-serif, system-ui, "PingFang SC", sans-serif; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .lane-a { fill: #161b22; }
      .lane-b { fill: #0d1117; }
      .lane-line { stroke: #30363d; }
